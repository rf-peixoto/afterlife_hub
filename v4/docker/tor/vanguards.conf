# vanguards add-on configuration for AFTERLIFE.
#
# The core protection (pinned layer-2/layer-3 guards against guard-discovery
# attacks) stays on. Circuit *closing* is turned off: vanguards 0.3.1 predates
# tor 0.4.8/0.4.9 and treats harmless "dropped cell" events on onion-service
# descriptor-upload circuits (HS_SERVICE_HSDIR) as attacks, force-closing them.
# That can stop the service descriptor from being published, making the onion
# unreachable from other machines. Suspicious events are still logged.
[Global]
close_circuits = False
